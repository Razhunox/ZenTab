<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido Kayden</title>
    <!-- Importación de fuente estilizada (Rajdhani) -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="NewTabCSS.css">
</head>

<body>
    <!-- Full-Height Right Side GIF Background -->
    <div class="right-gif-container">
        <img src="Imagenes/kucing-scuba-scuba-cat.gif" alt="Right Side Animation" class="right-gif">
    </div>

    <!-- 1. Music Audio & Buttons (Bottom-Left Corner) -->
    <div class="bottom-left-corner">
        <audio id="Party" loop></audio>
        
        <div class="music-controls">
            <!-- Play/Pause & Spin Button -->
            <img src="Imagenes/PalomaBoton.png" alt="Music Button" class="interactive-btn" id="Paloma" onclick="togglePlayAndSpin(event)">
            
            <!-- Next Random Song Button using LilithBoton -->
            <img src="Imagenes/LilithBoton.png" alt="Next Song" class="interactive-btn next-song-btn" onclick="playRandomSong(event)">
        </div>
    </div>

    <!-- Center Container (Title, Image & Search Bar) -->
    <div class="center-container" id="Pende">
        <!-- Cute Page Title -->
        <h1 class="page-title">Bienvenido Bastardo</h1>

        <div class="center-content-wrapper">
            <!-- Clickable image that toggles the search bar -->
            <img src="Imagenes/PendeBoton.png" alt="Toggle Search" class="center-image" onclick="toggleSearch()">

            <!-- Expanding Search Bar Form -->
            <form action="https://www.google.com/search" method="GET" target="_blank" id="searchForm" class="search-form">
                <input type="text" name="q" placeholder="Busquele causa" class="search-input" id="searchInput">
            </form>
        </div>
    </div>

    <!-- 3. Mini Gacha Game (Bottom-Center) -->
    <div class="gacha-container" onclick="pullGacha()">
        <img src="Imagenes/PendeLogo.png" alt="Gacha Machine" id="gachaImage" class="gacha-btn">
        <span class="gacha-text">Ludopatia</span>
    </div>

    <script>
        // Cleaned playlist array matching your actual Musica folder files
        var playlist = [
            "Musica/dancingaroundincirclesuntilmylittlefeetfalloff-spellcasting.mp3",
            "Musica/dogtalk!-spellcasting.mp3",
            "Musica/fivemagicsongbirdssoftlysingthewizardtosleep-spellcasting.mp3",
            "Musica/ifamousecouldsing...-spellcasting.mp3",
            "Musica/partyatclubbug!-spellcasting.mp3",
            "Musica/robothugs-spellcasting.mp3",
            "Musica/songformylostghostfriends!-spellcasting.mp3",
            "Musica/thealiendance-spellcasting.mp3",
            "Musica/youcan'tmakethisup!-spellcasting.mp3"
        ];

        // Load initial random song and attempt autoplay on load
        window.addEventListener('DOMContentLoaded', (event) => {
            var button = document.getElementById("Paloma");
            
            loadRandomSong(false);
            var song = document.getElementById("Party");
            
            song.play().then(() => {
                button.classList.add("spin");
            }).catch((error) => {
                document.addEventListener('click', function startAudioOnFirstClick() {
                    song.play();
                    button.classList.add("spin");
                    document.removeEventListener('click', startAudioOnFirstClick);
                }, { once: true });
            });
        });

        // Function to load a random song safely
        function loadRandomSong(shouldPlay = true) {
            var song = document.getElementById("Party");
            var button = document.getElementById("Paloma");
            var randomIndex = Math.floor(Math.random() * playlist.length);
            
            song.src = playlist[randomIndex];
            song.load(); // Forces the browser to load the new source properly

            if (shouldPlay) {
                song.play().then(() => {
                    button.classList.add("spin");
                }).catch(err => {
                    console.log("Playback error: ", err);
                });
            }
        }

        // Triggered when clicking the LilithBoton next song button
        function playRandomSong(event) {
            if (event) event.stopPropagation();
            var song = document.getElementById("Party");
            var button = document.getElementById("Paloma");
            var lilithBtn = event.currentTarget; // Targets the Lilith button clicked

            // Trigger the horizontal flip animation
            lilithBtn.classList.add("flip-horizontal");
            setTimeout(function() {
                lilithBtn.classList.remove("flip-horizontal");
            }, 600); // Removes class after 0.6s so it can flip again on next click

            // Load and play the random song
            loadRandomSong(false);
            song.play().then(() => {
                button.classList.add("spin");
            }).catch(err => {
                console.log("Audio play error: ", err);
            });
        }

        // Music play/pause toggle (resumes from same spot)
        function togglePlayAndSpin(event) {
            if (event) event.stopPropagation(); 

            var song = document.getElementById("Party");
            var button = document.getElementById("Paloma");

            if (song.paused) {
                song.play();
                button.classList.add("spin");
            } else {
                song.pause();
                button.classList.remove("spin");
            }
        }

        // Search bar side-expanding toggle function
        function toggleSearch() {
            var container = document.getElementById("Pende");
            var searchInput = document.getElementById("searchInput");

            container.classList.toggle("active");

            if (container.classList.contains("active")) {
                setTimeout(function() {
                    searchInput.focus();
                }, 300); 
            }
        }

        // Gacha rewards array
        var gachaRewards = [
            "Imagenes/Alix.jpeg", "Imagenes/Ander.png", "Imagenes/Arg.png",
            "Imagenes/Beth.png", "Imagenes/Beth2.jpg", "Imagenes/Beth3.png", "Imagenes/Beth4.png", "Imagenes/Beth5.png", "Imagenes/Beth6.jpg",
            "Imagenes/Color.jpg",
            "Imagenes/Dariya.png", "Imagenes/Dariya2.png", "Imagenes/Dariya3.png",
            "Imagenes/doodlegirl.jpeg",
            "Imagenes/Ha-Tonalli.png",
            "Imagenes/Hecate.png", "Imagenes/Hecate2.png",
            "Imagenes/Ice.jpeg",
            "Imagenes/Irisha.png", "Imagenes/Irisha2.png", "Imagenes/Irisha3.png", "Imagenes/Irisha4.png", "Imagenes/Irisha5.png", "Imagenes/Irisha6.jpg",
            "Imagenes/Lilia.png",
            "Imagenes/Lilith.png", "Imagenes/Lilith2.png", "Imagenes/Lilith3.png", "Imagenes/Lilith4.png", "Imagenes/Lilith5.png", "Imagenes/Lilith6.png", "Imagenes/Lilith7.jpg", "Imagenes/Lilith8.jpg", "Imagenes/Lilith9.jpg",
            "Imagenes/Lix.png", "Imagenes/Lix2.png", "Imagenes/Lix3.png", "Imagenes/Lix4.jpg",
            "Imagenes/Mai.jpg",
            "Imagenes/Morgan.png",
            "Imagenes/Pende.png", "Imagenes/Pende2.jpg",
            "Imagenes/Poon.png", "Imagenes/Poon2.jpg", "Imagenes/Poon3.png", "Imagenes/Poon4.png", "Imagenes/Poon5.jpg",
            "Imagenes/Prog.png",
            "Imagenes/sad.png",
            "Imagenes/Slime.png", "Imagenes/Slime2.png",
            "Imagenes/Valentine.jpeg", "Imagenes/Valentine2.jpeg", "Imagenes/Valentine3.jpeg",
            "Imagenes/Vinia.jpg", "Imagenes/Vinia2.png"
        ];

        function pullGacha() {
            var gachaImg = document.getElementById("gachaImage");

            gachaImg.classList.add("shake");

            setTimeout(function() {
                var randomIndex = Math.floor(Math.random() * gachaRewards.length);
                gachaImg.src = gachaRewards[randomIndex];
            }, 200);

            setTimeout(function() {
                gachaImg.classList.remove("shake");
            }, 400);
        }
    </script>

</body>

</html>
